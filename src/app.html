    const s = byId(id); if (!s) return;
    const { id: _id, ...doc } = JSON.parse(JSON.stringify(s));
    const fbs = fbFor(id).map(f => JSON.parse(JSON.stringify(f)));
    S.speakers = S.speakers.filter(x => x.id !== id);
    S.feedback = S.feedback.filter(f => f.speakerId !== id);
    if (S.openId === id) closeSpeaker(); else renderAll();
    write('speakers', id, 'remove');
    fbs.forEach(f => write('feedback', f.id, 'remove'));
    toast(`Removed ${s.name}`, { label: 'Undo', fn: () => {
      S.speakers.push(norm({ id, ...doc }));
      fbs.forEach(f => S.feedback.push(f));
      renderAll();
      write('speakers', id, 'set', doc);
      fbs.forEach(({ id: fid, ...fd }) => write('feedback', fid, 'set', fd));
      toast(`${s.name} is back`);
    } });
  }

  // ---------- events ----------
  document.addEventListener('click', e => {
    const t = e.target;
    const rm = t.closest('[data-remove]'); if (rm) { deleteSpeaker(rm.dataset.remove); return; }
    const open = t.closest('[data-open]'); if (open) { openSpeaker(open.dataset.open, open.dataset.tab || null); return; }
    const f = t.closest('[data-filter]'); if (f) { S.filter = f.dataset.filter; renderAll(); return; }
    const act = t.closest('[data-action]');
    if (act) {
      const a = act.dataset.action, s = byId(S.openId);
      if (a === 'unlock') { openUnlock(); return; }
      if (a === 'lock') { lockEditing(); toast('Editing locked on this device'); return; }
      if (a === 'new') openForm();
      else if (a === 'example') addExample();
      else if (a === 'clear') { S.q = ''; $('#q').value = ''; S.filter = 'all'; renderAll(); }
      else if (a === 'close') closeSpeaker();
      else if (a === 'edit' && s) openForm(s.id);
      else if (a === 'ask-delete') { S.confirmDelete = true; renderDrawer(); }
      else if (a === 'keep') { S.confirmDelete = false; renderDrawer(); }
      else if (a === 'delete' && s) deleteSpeaker(s.id);
      else if (a === 'cancel-edit') { S.editing = null; renderDrawer(); }
      else if (a === 'qstar') { S.qStar = !S.qStar; renderDrawer(); }
      return;
    }
  });
  $('#newBtn').addEventListener('click', () => openForm());
  $('#drawerBg').addEventListener('click', e => { if (e.target.id === 'drawerBg') closeSpeaker(); });
  document.addEventListener('keydown', e => {
    if (e.key !== 'Escape') return;
    if (!$('#unlockBg').hidden) closeUnlock(); else if (!$('#modalBg').hidden) closeForm(); else if (S.openId) closeSpeaker();
  });

  // brain nodes
  const brain = $('#brain');
  brain.addEventListener('click', e => { const g = e.target.closest('.node'); if (g) openSpeaker(g.dataset.id); });
  brain.addEventListener('keydown', e => { const g = e.target.closest('.node'); if (g && (e.key === 'Enter' || e.key === ' ')) { e.preventDefault(); openSpeaker(g.dataset.id); } });
  brain.addEventListener('pointerover', e => { const g = e.target.closest('.node'); if (g) showTip(g); });
  brain.addEventListener('pointerout', e => { if (e.target.closest('.node')) $('#tip').hidden = true; });
  brain.addEventListener('focusin', e => { const g = e.target.closest('.node'); if (g) showTip(g); });
  brain.addEventListener('focusout', () => { $('#tip').hidden = true; });

  $('#q').addEventListener('input', e => { S.q = e.target.value; renderGrid(); });
  $('#sort').value = S.sort;
  $('#sort').addEventListener('change', e => { S.sort = e.target.value; try { localStorage.setItem('sb-sort', S.sort); } catch {} renderGrid(); });

  // drawer header + tabs
  $('#dHead').addEventListener('click', e => {
    const b = e.target.closest('[data-status]'); if (!b || !S.canWrite) return;
    patchSpeaker(S.openId, { status: b.dataset.status });
  });
  $('#dTabs').addEventListener('click', e => {
    const b = e.target.closest('[data-tab]'); if (!b) return;
    if (b.dataset.tab !== S.tab) stopGame();
    S.tab = b.dataset.tab; S.editing = null; renderDrawer();
  });
  $('#dTabs').addEventListener('keydown', e => {
    if (e.key !== 'ArrowRight' && e.key !== 'ArrowLeft') return;
    const keys = Object.keys(LOBES); let i = keys.indexOf(S.tab);
    i = (i + (e.key === 'ArrowRight' ? 1 : -1) + keys.length) % keys.length;
    stopGame(); S.tab = keys[i]; S.editing = null; renderDrawer(); $('#dTabs [aria-selected="true"]').focus();
  });

  // drawer body actions
  const body = $('#dBody');
  body.addEventListener('click', e => {
    const s = byId(S.openId); if (!s) return;
    const k = e.target.closest('[data-kind]'); if (k) { S.rKind = k.dataset.kind; body.querySelectorAll('[data-kind]').forEach(b => b.setAttribute('aria-pressed', b === k)); return; }
    const b = e.target.closest('[data-act]'); if (!b) return;
    const id = b.dataset.id, act = b.dataset.act;
    const qs = s.questions.map(q => ({ ...q }));
    const qi = qs.findIndex(q => q.id === id);
    if (act === 'edit') { S.editing = id; renderDrawer(); setTimeout(() => body.querySelector('[data-edit-form] textarea')?.focus(), 0); }
    else if (act === 'del-r') patchSpeaker(s.id, { research: s.research.filter(r => r.id !== id) });
    else if (act === 'toggle-q' && qi > -1) { qs[qi].asked = !qs[qi].asked; patchSpeaker(s.id, { questions: qs }); }
    else if (act === 'star-q' && qi > -1) { qs[qi].star = !qs[qi].star; patchSpeaker(s.id, { questions: qs }); }
    else if ((act === 'up-q' || act === 'down-q') && qi > -1) {
      const j = act === 'up-q' ? qi - 1 : qi + 1; if (j < 0 || j >= qs.length) return;
      [qs[qi], qs[j]] = [qs[j], qs[qi]]; patchSpeaker(s.id, { questions: qs });
    }
    else if (act === 'del-q') patchSpeaker(s.id, { questions: qs.filter(q => q.id !== id) });
    else if (act === 'show-ans') { S.showAns.add(id); renderDrawer(); setTimeout(() => document.getElementById('ans-' + id)?.focus(), 0); }
    else if (act === 'del-t') patchSpeaker(s.id, { takeaways: s.takeaways.filter(t => t.id !== id) });
    else if (act === 'del-s') patchSpeaker(s.id, { scribbles: s.scribbles.filter(n => n.id !== id) });
    else if (act === 'to-r' || act === 'to-q') {
      const n = s.scribbles.find(x => x.id === id); if (!n) return;
      const rest = s.scribbles.filter(x => x.id !== id);
      if (act === 'to-r') patchSpeaker(s.id, { scribbles: rest, research: [...s.research, { id: uid('r'), kind: 'background', text: n.text, link: '' }] });
      else patchSpeaker(s.id, { scribbles: rest, questions: [...s.questions, { id: uid('q'), text: n.text, star: false, asked: false, answer: '' }] });
      toast(act === 'to-r' ? 'Moved to Research' : 'Moved to Questions');
    }
    else if (act === 'del-gt') patchSpeaker(s.id, { game: { ...s.game, trues: s.game.trues.filter(t => t.id !== id) } });
    else if (act === 'del-gf') patchSpeaker(s.id, { game: { ...s.game, fakes: s.game.fakes.filter(t => t.id !== id) } });
    else if (act === 'ai') runAI(s, S.tab, b.dataset.preset);
    else if (act === 'ai-stop') { const st = aiState(S.tab); if (st.ctl) st.ctl.abort(); }
    else if (act === 'ai-add') aiAdd(s, S.tab, [Number(b.dataset.i)]);
    else if (act === 'ai-add-all') aiAdd(s, S.tab, aiState(S.tab).items.map((_, i) => i));
    else if (act === 'snake-start') startGame();
    else if (act === 'snake-pause') togglePause();
    else if (act === 'gen-fakes') makeFakes(s);
    else if (act === 'turn') turnTo(b.dataset.dir);
    else if (act === 'del-f') { S.feedback = S.feedback.filter(f => f.id !== id); renderAll(); write('feedback', id, 'remove'); }
  });

  body.addEventListener('submit', e => {
    e.preventDefault();
    const s = byId(S.openId); if (!s) return;
    const form = e.target;
    if (form.id === 'addResearch') {
      const text = $('#rText').value.trim(); const link = cleanLink($('#rLink').value);
      if (!text) { toast('Write what you found first.'); $('#rText').focus(); return; }
      if (link === null) { toast("That link doesn't look right. Paste a full web address."); return; }
      $('#rText').value = ''; $('#rLink').value = '';
      patchSpeaker(s.id, { research: [...s.research, { id: uid('r'), kind: S.rKind, text, link }] });
      $('#rText')?.focus();
    } else if (form.id === 'addQuestion') {
      const text = $('#qText').value.trim();
      if (!text) { $('#qText').focus(); return; }
      $('#qText').value = '';
      const star = S.qStar; S.qStar = false;
      patchSpeaker(s.id, { questions: [...s.questions, { id: uid('q'), text, star, asked: false, answer: '' }] });
      $('#qText')?.focus();
    } else if (form.id === 'addTakeaway') {
      const text = $('#tText').value.trim(); if (!text) return;
      $('#tText').value = '';
      patchSpeaker(s.id, { takeaways: [...s.takeaways, { id: uid('t'), text }] });
      $('#tText')?.focus();
    } else if (form.id === 'aiForm') {
      const inp = document.getElementById('aiAsk-' + S.tab); if (!inp) return;
      const text = inp.value.trim(); if (!text) { inp.focus(); return; }
      inp.value = '';
      runAI(s, S.tab, null, text);
    } else if (form.id === 'addRough') {
      const text = $('#sText').value.trim(); if (!text) { $('#sText').focus(); return; }
      $('#sText').value = '';
      patchSpeaker(s.id, { scribbles: [...s.scribbles, { id: uid('n'), text, at: Date.now() }] });
      $('#sText')?.focus();
    } else if (form.id === 'addTrue' || form.id === 'addFake') {
      const inp = form.id === 'addTrue' ? $('#gTrue') : $('#gFake');
      const text = inp.value.trim(); if (!text) { inp.focus(); return; }
      inp.value = '';
      const key = form.id === 'addTrue' ? 'trues' : 'fakes';
      patchSpeaker(s.id, { game: { ...s.game, [key]: [...s.game[key], { id: uid('g'), text }] } });
      (form.id === 'addTrue' ? $('#gTrue') : $('#gFake'))?.focus();
    } else if (form.id === 'addFeedback') {
      const text = $('#fbText').value.trim(); if (!text) return;
      $('#fbText').value = '';
      const id = uid('f'); const doc = { speakerId: s.id, by: S.meId, text, at: Date.now() };
      if (S.web) doc.byName = S.myName || 'Someone';
      S.feedback.push({ id, ...doc }); renderAll();
      write('feedback', id, 'set', doc);
    } else if (form.dataset.editForm) {
      const id = form.dataset.id;
      if (form.dataset.editForm === 'research') {
        const text = document.getElementById('er-' + id).value.trim();
        const link = cleanLink(document.getElementById('el-' + id).value);
        if (!text) return; if (link === null) { toast("That link doesn't look right."); return; }
        S.editing = null;
        patchSpeaker(s.id, { research: s.research.map(r => r.id === id ? { ...r, text, link } : r) });
      } else {
        const text = document.getElementById('eq-' + id).value.trim(); if (!text) return;
        S.editing = null;
        patchSpeaker(s.id, { questions: s.questions.map(q => q.id === id ? { ...q, text } : q) });
      }
    }
  });

  // notes + answers save as you type
  const timers = {};
  body.addEventListener('input', e => {
    const s = byId(S.openId); if (!s) return;
    if (e.target.id === 'notesArea') {
      const v = e.target.value;
      $('#notesWords').textContent = words(v) + ' words';
      $('#notesState').textContent = 'Saving…';
      clearTimeout(timers.notes);
      timers.notes = setTimeout(async () => {
        await patchSpeaker(s.id, { notes: v });
        const st = $('#notesState'); if (st) st.textContent = 'Saved';
      }, 700);
    } else if (e.target.classList.contains('answer')) {
      const qid = e.target.dataset.qid, v = e.target.value;
      clearTimeout(timers[qid]);
      timers[qid] = setTimeout(() => {
        const cur = byId(s.id); if (!cur) return;
        patchSpeaker(s.id, { questions: cur.questions.map(q => q.id === qid ? { ...q, answer: v } : q) });
      }, 700);
    }
  });
  body.addEventListener('keydown', e => {
    if (e.target.id === 'sText' && e.key === 'Enter' && !e.shiftKey && !e.isComposing) { e.preventDefault(); $('#addRough').requestSubmit(); }
  });
  body.addEventListener('toggle', e => { if (e.target.id === 'gBank') S.bankOpen = e.target.open; }, true);
  body.addEventListener('focusout', e => {
    if (e.target.id === 'notesArea') setTimeout(() => renderDrawer(), 800);
  });

  // ---------- render ----------
  function renderAll() {
    renderBrain(); renderActivity(); renderFilters(); renderGrid();
    if (S.openId) renderDrawer();
  }

  // ---------- boot ----------
  // ---------- website mode (Vercel): data lives behind /api/store, editing needs the class passcode ----------
  const API = {
    async get(since) {
      const r = await fetch('/api/store' + (since != null ? '?since=' + encodeURIComponent(since) : ''), { cache: 'no-store' });
      const j = await r.json().catch(() => ({}));
      if (!r.ok) throw { code: 'unavailable', status: r.status, message: j.error || 'The site could not load its data.' };
      return j;
    },
    async post(body) {
      const r = await fetch('/api/store', { method: 'POST', headers: { 'content-type': 'application/json', 'x-passcode': S.pass || '' }, body: JSON.stringify(body) });
      const j = await r.json().catch(() => ({}));
      if (!r.ok) throw { code: r.status === 401 ? 'locked' : r.status === 413 ? 'quota_exceeded' : (r.status === 400 || r.status === 404) ? 'bad_request' : 'unavailable', message: j.error };
      return j;
    }
  };

  function webBackend(initial) {
    const subs = {};
    let version = initial.version, timer = null, pending = 0;
    const deliver = d => { ['speakers', 'feedback'].forEach(col => (subs[col] || []).forEach(cb => cb(d[col] || []))); };
    async function poll() {
      clearTimeout(timer);
      try {
        if (pending) return;
        const d = await API.get(version);
        if (!d.unchanged && !pending) { version = d.version; deliver(d); }
      } catch {} finally {
        clearTimeout(timer);
        timer = setTimeout(poll, document.hidden ? 30000 : 4000);
      }
    }
    const send = async body => {
      pending++;
      try { return await API.post(body); } finally { pending--; if (!pending) poll(); }
    };
    document.addEventListener('visibilitychange', () => { if (!document.hidden) poll(); });
    return {
      live: true,
      subscribe(col, cb) { (subs[col] = subs[col] || []).push(cb); setTimeout(() => cb(initial[col] || []), 0); if (!timer) timer = setTimeout(poll, 4000); return () => {}; },
      set: (col, id, data) => send({ op: 'set', col, id, data }),
      update: (col, id, data) => send({ op: 'update', col, id, data }),
      remove: (col, id) => send({ op: 'remove', col, id })
    };
  }

  function parseLooseJSON(t) {
    t = String(t || '').trim();
    try { return JSON.parse(t); } catch {}
    const f = t.match(/```(?:json)?\s*([\s\S]*?)```/);
    if (f) { try { return JSON.parse(f[1]); } catch {} }
    const a = t.search(/[\[{]/), b = Math.max(t.lastIndexOf(']'), t.lastIndexOf('}'));
    if (a > -1 && b > a) { try { return JSON.parse(t.slice(a, b + 1)); } catch {} }
    throw { code: 'invalid_json' };
  }
  const webSample = {
    async json(prompt, opts = {}) {
      let r;
      try {
        r = await fetch('/api/ai', { method: 'POST', headers: { 'content-type': 'application/json', 'x-passcode': S.pass || '' }, body: JSON.stringify({ prompt }), signal: opts.signal });
      } catch (e) { throw { code: e && e.name === 'AbortError' ? 'cancelled' : 'upstream_error' }; }
      const j = await r.json().catch(() => ({}));
      if (!r.ok) throw { code: r.status === 401 ? 'locked' : r.status === 429 ? 'rate_limited' : r.status === 422 ? 'refused' : r.status === 503 ? 'sampling_disabled' : 'upstream_error', message: j.error };
      return parseLooseJSON(j.text);
    }
  };

  function store(k, v) { try { if (v == null) localStorage.removeItem(k); else localStorage.setItem(k, v); } catch {} }
  function read(k) { try { return localStorage.getItem(k) || ''; } catch { return ''; } }

  function applyWebAccess() {
    S.sample = S.unlocked && S.config.ai ? webSample : null;
    S.aiOff = !S.config.ai ? "The AI helper isn't switched on for this site yet. It needs an Anthropic API key in the Vercel settings."
      : 'Unlock editing to use the AI helper.';
    const banner = $('#banner'), chip = $('#meChip');
    if (S.unlocked) {
      banner.hidden = true;
      chip.innerHTML = S.config.passcodeSet
        ? `<span></span><button class="ghost" type="button" data-action="lock">Lock</button>`
        : `<span></span><button class="ghost" type="button" data-action="unlock">${S.myName ? 'Change name' : 'Add your name'}</button>`;
      chip.querySelector('span').textContent = S.myName ? 'Editing as ' + S.myName : 'Anyone with the link can edit';
      chip.hidden = false;
    } else {
      chip.hidden = true;
      banner.innerHTML = S.config.passcodeSet
        ? `<span><b>View only.</b> Anyone with the link can read this page. To add or change things, unlock editing with the class passcode.</span><button class="btn small primary" type="button" data-action="unlock">Unlock editing</button>`
        : `<span><b>Editing is switched off.</b> The site owner needs to set a class passcode (EDIT_PASSCODE) in the Vercel settings.</span>`;
      banner.hidden = false;
    }
    setReadonly(!S.unlocked);
  }
  function lockEditing() {
    S.unlocked = false; S.pass = ''; store('sb-pass', null);
    if (S.web) applyWebAccess();
  }
  function openUnlock() {
    const open = !S.config.passcodeSet;
    $('#uTitle').textContent = open ? 'Your name' : 'Unlock editing';
    $('#uHelp').textContent = open ? 'Your name shows next to any feedback you leave.'
      : 'Ask the page owner for the class passcode. Your name shows next to any feedback you leave.';
    $('#uPassRow').hidden = open;
    $('#unlockForm [type=submit]').textContent = open ? 'Save' : 'Unlock';
    $('#uPass').value = ''; $('#uName').value = S.myName || ''; $('#uErr').hidden = true;
    $('#unlockBg').hidden = false; document.body.classList.add('locked');
    setTimeout(() => (open ? $('#uName') : $('#uPass')).focus(), 30);
  }
  function closeUnlock() { $('#unlockBg').hidden = true; if (!S.openId) document.body.classList.remove('locked'); }
  $('#unlockForm').addEventListener('submit', async e => {
    e.preventDefault();
    const pass = $('#uPass').value.trim(), name = $('#uName').value.trim(), err = $('#uErr');
    if (!S.config.passcodeSet) {
      if (!name) { err.textContent = 'Type your name.'; err.hidden = false; return; }
      S.myName = name; store('sb-name', name);
      closeUnlock(); applyWebAccess(); toast('Name saved');
      return;
    }
    if (!pass) { err.textContent = 'Type the class passcode.'; err.hidden = false; return; }
    if (!name) { err.textContent = 'Add your name so your comments show who wrote them.'; err.hidden = false; return; }
    S.pass = pass;
    try {
      await API.post({ op: 'check' });
    } catch (x) {
      S.pass = '';
      err.textContent = x && x.code === 'locked' ? "That passcode didn't work. Check it and try again." : "Couldn't reach the site. Check your connection and try again.";
      err.hidden = false; return;
    }
    S.myName = name; S.unlocked = true;
    store('sb-pass', pass); store('sb-name', name);
    closeUnlock(); applyWebAccess(); toast('Editing unlocked');
  });
  $('#uCancel').addEventListener('click', closeUnlock);
  $('#unlockBg').addEventListener('click', e => { if (e.target.id === 'unlockBg') closeUnlock(); });

  async function bootWeb() {
    S.web = true;
    S.meId = read('sb-me'); if (!S.meId) { S.meId = uid('u'); store('sb-me', S.meId); }
    S.myName = read('sb-name'); S.pass = read('sb-pass');
    const banner = $('#banner');
    let first = null, problem = null;
    try { first = await API.get(); } catch (e) { problem = e; }
    if (!first) {
      S.web = false;
      S.backend = memoryBackend();
      banner.innerHTML = problem && problem.status
        ? `<span><b>The site can't load its data.</b> ${esc(problem.message)}</span>`
        : `<b>Preview mode.</b>&nbsp;Changes made here disappear when you close the page.`;
      banner.hidden = false;
      subscribeAll();
      return;
    }
    S.config = { ai: !!first.ai, passcodeSet: !!first.passcodeSet };
    S.backend = webBackend(first);
    if (!S.config.passcodeSet) S.unlocked = true;
    else if (S.pass) {
      try { await API.post({ op: 'check' }); S.unlocked = true; } catch { S.pass = ''; store('sb-pass', null); }
    }
    applyWebAccess();
    subscribeAll();
  }

  async function boot() {
    buildBrain();
    renderAll();
    const c = window.claude;
    if (!(c && c.use)) { await bootWeb(); return; }
    let db = null, user = null;
    if (c && c.use) {
      [db, user, S.sample] = await Promise.all([c.use('db').catch(() => null), c.use('user').catch(() => null), c.use('sample').catch(() => null)]);
    }
    S.user = user;
    if (user) {
      const me = await user.me();
      S.meId = me.id;
      const can = await user.can('data.write');
      if (can === false) setReadonly(true);
      if (me.name) {
        const chip = $('#meChip');
        chip.innerHTML = `<img alt="" src="${esc(me.avatarUrl)}"><span></span>`;
        chip.querySelector('span').textContent = me.name;
        chip.hidden = false;
      }
    }
    S.backend = null;
    const banner = $('#banner');
    if (db) {
      S.backend = dbBackend(db);
      if (!S.canWrite) { banner.innerHTML = `<b>View only.</b>&nbsp;You can read everything here. To add speakers or comments, ask the owner to share it with you as an Editor.`; banner.hidden = false; }
    } else {
      S.backend = memoryBackend();
      banner.innerHTML = `<b>Preview mode.</b>&nbsp;Open this page signed in to claude.ai to save your speakers. Changes made here disappear when you close it.`;
      banner.hidden = false;
    }
    subscribeAll();
  }

  function subscribeAll() {
    let first = true;
    const onErr = e => { if (e && e.code === 'revoked') toast('Your access to this page changed. Reload to continue.'); };
    S.backend.subscribe('speakers', docs => {
      S.speakers = docs.map(norm); S.loaded = true;
      renderAll();
      if (first) {
        first = false;
        const h = (location.hash || '').slice(1);
        if (h && byId(h)) openSpeaker(h);
      }
    }, onErr);
    S.backend.subscribe('feedback', docs => {
      S.feedback = docs.filter(d => d.speakerId && typeof d.text === 'string');
      renderAll();
    }, onErr);
    setTimeout(() => { if (!S.loaded) { S.loaded = true; renderAll(); } }, 8000);
  }
  boot();
})();
</script>
